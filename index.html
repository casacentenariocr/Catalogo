<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo | Casa Centenario</title><style>
:root{--green:#07552f;--cream:#f7f3e8;--ink:#1e2822;--muted:#657069}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f5f2;color:var(--ink)}header{background:linear-gradient(135deg,var(--green),#123e2a);color:white;padding:20px 18px 22px;box-shadow:0 2px 12px #0002}.head{max-width:1200px;margin:auto}.identity{display:flex;align-items:center;gap:17px}.logo{width:95px;height:95px;object-fit:contain;flex-shrink:0}.brand{font-size:28px;font-weight:800;letter-spacing:.4px}.sub{opacity:.9;margin-top:6px}.controls{margin:19px auto 0;display:grid;grid-template-columns:1fr 240px;gap:10px}.offer-toggle{border:2px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}.offer-toggle.active{background:#fff;color:var(--green)}.offer-badge{display:inline-block;background:#c62828;color:#fff;font-size:12px;font-weight:800;padding:6px 9px;border-radius:7px;margin-bottom:8px}.old-price{font-size:14px;color:#777;text-decoration:line-through;margin-top:10px}.saving{font-size:12px;color:#b42318;font-weight:700;margin-top:4px}input,select{width:100%;padding:13px 14px;border:0;border-radius:10px;font-size:16px;outline:none}main{max-width:1200px;margin:22px auto;padding:0 16px}.summary{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #00000012;border:1px solid #e5e7e2;display:flex;flex-direction:column}.pic{position:relative;height:235px;background:#ffffff;display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:contain;padding:12px}.placeholder{padding:20px;text-align:center;color:#7b817d;font-weight:700}.body{padding:15px;display:flex;flex-direction:column;flex:1}.code{font-size:12px;color:#7b817d}.cat{font-size:12px;color:var(--green);font-weight:700;margin:6px 0}h2{font-size:16px;line-height:1.3;margin:2px 0 8px}.review{font-size:13px;line-height:1.45;color:#505a54;flex:1}.price{font-size:23px;font-weight:800;color:var(--green);margin-top:13px}.status{font-size:11px;color:#8a6a20;margin-top:6px}.empty{text-align:center;padding:60px 10px;color:var(--muted)}footer{text-align:center;padding:35px 15px;color:#68716c;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.controls{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.pic{height:200px}.brand{font-size:24px}.logo{width:75px;height:75px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.pic{height:270px}.logo{width:65px;height:65px}}
</style></head><body><header><div class="head"><div class="identity"><img class="logo" src="logo-casa-centenario.png" alt="Logotipo Casa Centenario"><div><div class="brand">Casa Centenario</div><div class="sub">Catálogo de productos</div></div></div><div class="controls"><input id="q" placeholder="Buscar por producto o código…" aria-label="Buscar productos"><select id="cat" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option></select><button id="offers" class="offer-toggle" type="button" aria-pressed="false">🔥 Ofertas</button></div></div></header><main><div class="summary"><span id="count"></span><span>Precios en colones (₡)</span></div><div id="grid" class="grid"></div></main><footer style="background:#07552f;color:#ffffff;text-align:center;padding:28px 15px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.8;margin-top:35px;">
  <img src="logo-casa-centenario.png" alt="Logotipo Casa Centenario" style="display:block;width:105px;height:105px;object-fit:contain;margin:0 auto 12px;">

  <div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:12px;row-gap:3px;">
    <span>☎ 2216-4200</span>
    <span style="color:#e8d5a2;">|</span>
    <span>🕒 Lunes a Viernes · 10:00 a. m. – 6:00 p. m.</span>
  </div>

  <div style="border-top:1px solid #b99a56;max-width:690px;margin:16px auto;"></div>

  <div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:12px;row-gap:4px;">
    <span>Facebook: Centenario Internacional</span>
    <span style="color:#e8d5a2;">/</span>
    <span>Instagram: casacentenariocr</span>
  </div>

  <div style="margin-top:8px;">📍 Waze: Teatro Centenario / 100 metros al sur de la entrada Saturnia Curridabat</div>

  <div style="font-size:11px;color:#d9e5dc;margin-top:14px;letter-spacing:1.5px;">CENTENARIO INTERNACIONAL</div>
</footer><script src="productos.js"></script><script>
const money=n=>new Intl.NumberFormat('es-CR',{style:'currency',currency:'CRC',maximumFractionDigits:0}).format(n);
const all=(window.PRODUCTOS||[]).filter(p=>String(p.activo).toLowerCase()!=='no');
const cat=document.getElementById('cat'),q=document.getElementById('q'),grid=document.getElementById('grid'),count=document.getElementById('count'),offers=document.getElementById('offers');let offersOnly=false;
[...new Set(all.map(p=>p.categoria||'Otros'))].sort((a,b)=>a.localeCompare(b,'es')).forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)});
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const term=q.value.trim().toLowerCase(),c=cat.value;const arr=all.filter(p=>(!offersOnly||p.enOferta)&&(!c||p.categoria===c)&&(!term||(p.producto+' '+p.codigo+' '+p.resena).toLowerCase().includes(term)));count.textContent=arr.length+' producto'+(arr.length===1?'':'s')+(offersOnly?' en oferta':'');if(!arr.length){grid.innerHTML='<div class="empty">No encontramos productos con esos filtros.</div>';return}grid.innerHTML=arr.map(p=>{const promo=!!p.enOferta&&Number(p.descuento)>0;const pct=Math.round(Number(p.descuento)*100);const price=promo?Number(p.precioOferta):Number(p.precio);const saving=promo?Number(p.precio)-price:0;return `<article class="card"><div class="pic">${promo?`<div style="position:absolute;z-index:1;align-self:flex-start;margin:10px;background:#c62828;color:white;padding:7px 9px;border-radius:7px;font-size:12px;font-weight:800">${pct}% DESCUENTO</div>`:''}<img src="imagenes/${encodeURIComponent(p.imagen||p.codigo+'.jpg')}" alt="${esc(p.producto)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="placeholder" style="display:none">Imagen pendiente<br><small>${esc(p.codigo)}</small></div></div><div class="body"><div class="code">${esc(p.codigo)}</div><div class="cat">${esc(p.categoria)}</div><h2>${esc(p.producto)}</h2><div class="review">${esc(p.resena)}</div>${promo?`<div class="old-price">Antes: ${money(Number(p.precio))}</div>`:''}<div class="price">${money(price)}</div>${promo?`<div class="saving">Ahorrás ${money(saving)}</div>`:''}${p.estadoImagen?`<div class="status">${esc(p.estadoImagen)}</div>`:''}</div></article>`}).join('')}
q.addEventListener('input',render);cat.addEventListener('change',render);offers.addEventListener('click',()=>{offersOnly=!offersOnly;offers.classList.toggle('active',offersOnly);offers.setAttribute('aria-pressed',String(offersOnly));render()});render();
</script></body></html>
